{# Converted to extend 'layout.html' so this page uses the global header/footer and theme #}
{% extends "layout.html" %}

{% block body %}
<!-- Index showcase wrapper: uses .section-wrapper and a card-styled panel for consistent spacing -->
<div class="section-wrapper">
  <!-- showcase-panel: background image set inline for convenience; overlay handled in CSS (.showcase-panel::before) -->
  <div class="content-card showcase-panel text-center" style="background-image: url('{{ url_for('static', filename='images/London.png') }}'); background-position: center; background-size: cover;">
    <div>
      <!-- Heading follows site type scale; keep concise for accessibility -->
      <h1>Welcome to the UK Activity Registration Service.</h1>
      <!-- Short description under the heading -->
      <p>Register for an activity and enjoy your trip!</p>
      <div style="margin-top:18px">
        <!-- Primary CTA: uses .btn-primary for consistent look with other buttons -->
        <a class="btn-primary" href="/activities">View Activities</a>
        <!-- Secondary CTA: transparent variant for subtle action -->
        <a class="btn-secondary" href="/signup">Sign up</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
