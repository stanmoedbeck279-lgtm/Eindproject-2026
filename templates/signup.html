{% extends "layout.html" %}

{% block body %}
<!-- ADDED: centered `.content-card` wrapper for signup form -->
<div class="auth-panel">
    <div class="content-card">
        {% if error %}
            <p class="form-error">{{ error }}</p>
        {% endif %}
        <h2 class="text-center">Create Account</h2>
        <form action="/signup" method="post">
            <input autocomplete="off" autofocus name="name" placeholder="Name" type="text">
            <input autocomplete="off" name="password" placeholder="Password" type="password">
            <input autocomplete="off" name="confirmation" placeholder="Confirm Password" type="password">
            <div style="display:flex;justify-content:center;margin-top:12px">
                <button type="submit">Create Account</button>
            </div>
        </form>
        <p class="text-center" style="margin-top:12px">Already have an account? <a href="/login">Login</a></p>
    </div>
</div>
{% endblock %}
