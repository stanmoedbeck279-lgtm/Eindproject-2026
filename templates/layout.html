<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>ARS</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- ADDED: Responsive header with brand/logo and top navigation -->
    <header class="site-header">
        <div class="page-container header-content">
            <a class="site-brand" href="/">
                <img src="{{ url_for('static', filename='images/UK-flag.svg') }}" alt="logo" class="brand-logo">
                <div class="brand-text">
                    <span class="brand-title">ARS</span>
                    <small class="brand-tagline">Activity Registration Service</small>
                </div>
            </a>
            <nav class="site-nav">
                <a href="/">Home</a>
                <a href="/activities">Activities</a>
                <a href="/registrants">Registers</a>
                <a href="/login">Login</a>
                <a href="/signup">Sign up</a>
            </nav>
        </div>
    </header>

    <!-- ADDED: Main content container. Individual pages use `.content-card` for panels. -->
    <main class="page-container page-main">
        {% block body %}{% endblock %}
    </main>

    <!-- ADDED: Site footer -->
    <footer class="site-footer">
        <div class="page-container footer-inner">
            <p>&copy; 2026 ARS</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
